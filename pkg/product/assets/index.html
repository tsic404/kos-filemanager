<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>文件管理</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="bar">
      <h1>文件管理</h1>
      <div class="view-switch" role="group" aria-label="视图">
        <button type="button" id="view-list" data-view="list" aria-pressed="true">列表</button>
        <button type="button" id="view-grid" data-view="grid" aria-pressed="false">网格</button>
      </div>
      <p class="status" id="status" role="status">正在连接控制台…</p>
    </header>
    <nav class="path-bar" aria-label="当前位置">
      <span class="path-label">位置</span>
      <span class="path" id="path">卷根</span>
      <span class="path-actions">
        <button type="button" class="action" id="upload" hidden>上传</button>
        <input type="file" id="upload-file" hidden />
        <button type="button" class="action" id="root" hidden>返回卷根</button>
        <button type="button" class="action" id="back" hidden>返回卷列表</button>
      </span>
    </nav>
    <main class="workspace">
      <section class="panel" aria-labelledby="volumes-heading">
        <div class="panel-bar">
          <h2 id="volumes-heading">授权卷</h2>
          <div class="panel-tools">
            <span class="count" id="count"></span>
          </div>
        </div>
        <ul class="volumes list" id="volumes"></ul>
        <p class="empty" id="volumes-empty" hidden>暂无授权卷。</p>
        <p class="problems" id="problems" hidden></p>
      </section>
      <div class="column">
        <section class="panel" id="browser-panel" aria-labelledby="browser-heading" hidden>
          <div class="panel-bar">
            <h2 id="browser-heading">目录</h2>
            <div class="panel-tools">
              <span class="count" id="entries-count"></span>
              <button type="button" class="action" id="refresh" hidden>刷新</button>
            </div>
          </div>
          <p class="truncated" id="truncated" hidden></p>
          <ul class="entries list" id="entries"></ul>
          <p class="empty" id="entries-empty" hidden>此目录为空。</p>
        </section>
        <section class="panel" id="transfer-panel" aria-labelledby="transfer-heading" hidden>
          <div class="panel-bar">
            <h2 id="transfer-heading">传输</h2>
            <div class="panel-tools">
              <span class="count" id="transfer-state"></span>
              <button type="button" class="action" id="transfer-confirm" hidden>确认覆盖</button>
              <button type="button" class="action" id="transfer-cancel" hidden>取消</button>
              <button type="button" class="action" id="transfer-dismiss" hidden>关闭</button>
            </div>
          </div>
          <p class="transfer-name" id="transfer-name"></p>
          <progress class="transfer-progress" id="transfer-progress" max="1" value="0"></progress>
          <p class="transfer-meta" id="transfer-meta"></p>
        </section>
        <section class="panel" id="preview-panel" aria-labelledby="preview-heading" hidden>
          <div class="panel-bar">
            <h2 id="preview-heading">预览</h2>
            <div class="panel-tools">
              <span class="count" id="preview-meta"></span>
              <button type="button" class="action" id="preview-close">关闭</button>
            </div>
          </div>
          <pre class="preview-text" id="preview-text" hidden></pre>
          <img class="preview-image" id="preview-image" alt="" hidden />
          <p class="truncated" id="preview-cut" hidden>预览已截断。</p>
        </section>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
